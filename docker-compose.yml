services:

  ollama-auth:
#    image: ghcr.io/g1ibby/ollama-auth:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "11435:80"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}  
    volumes:
      - ${OLLAMA_LOCAL_DIR:-ollama_models}:/root/.ollama

volumes:
  ollama_models:
    driver: local
